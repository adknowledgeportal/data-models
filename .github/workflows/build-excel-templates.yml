# Rebuilds the ADKP Excel templates from the registered sage.schemas.ad JSON
# schemas and uploads them to the data dictionary folder on Synapse.
#
# Triggered on:
#   - workflow_run  - after the register-schema workflow completes successfully
#                     for a full release (pre-release and pull request runs only
#                     register to test.ad, so they're skipped)
#   - workflow_dispatch - manual run from the Actions tab (catch-up or rebuild)
#
# A workflow_run event looks the same for a pre-release run and a full-release
# run (both are event=release with the tag as head_branch), so the first step
# reads the registration run's log for the org it registered to. Checking the
# release itself would race with a pre-release being promoted mid-run.
#
# The build is shown on the GitHub release page, so the person doing the
# release can follow it without opening the Actions tab: an "Excel templates"
# section at the end of the release notes says it's building (with a reminder
# to update Core Models meanwhile), then whether it succeeded or failed. Open
# Dependabot PRs are listed there too, as a reminder of the monthly
# maintenance (Monthly Maintenance in the README).
#
# Steps:
#   1. Check release              - skips runs that registered to test.ad
#   2. Resolve the version        - the registered version to build (blank
#                                   manual version = newest); used for the
#                                   build and both release-page updates
#   3. Show the build started     - "building" status on the release page
#   4. Build and upload templates - runs scripts/create_excel_templates.py, which
#                                   builds one workbook per schema registered at
#                                   that version and uploads each as a new version
#                                   of the existing file (or a new file), labeled
#                                   with modelVersion and releaseDate
#   5. Show the result            - ✅/❌ status on the release page
#   6. Upload workbooks           - saves the workbooks as a workflow artifact
#
# Required configuration:
#   secret   SYNAPSE_TOKEN_DPE  - Synapse token with edit access to the data
#                                 dictionary folder (shared with register-schema.yml)
#   variable TEMPLATE_FOLDER_ID - Synapse ID of that folder
#
# If this fails, see docs/excel-templates-maintenance.md.

name: Build Excel templates
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Excel templates {0} (manual{1})', inputs.version || 'newest', inputs.dry-run && ', dry run' || '')
      || format('Excel templates for {0}', github.event.workflow_run.head_branch) }}

on:
  workflow_run:
    # Matched by the name: of register-schema.yml, not its file name. The
    # corrected spelling is listed too so fixing the "SON" typo doesn't stop
    # this workflow from running; any other rename must be added here.
    workflows:
      - "Generate, register SON Schemas and Create RecordSets"
      - "Generate, register JSON Schemas and Create RecordSets"
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Data model version, e.g. 1.0.9 (leave blank for the newest registered)"
        required: false
        type: string
      dry-run:
        description: "Build only, don't upload to Synapse (uncheck to upload)"
        required: false
        type: boolean
        default: true

# One build at a time; don't cancel a run partway through uploading
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-upload-templates:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    permissions:
      contents: write       # edit the release notes (build status)
      actions: read         # read the registration run's log
      pull-requests: read   # list open Dependabot PRs
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            # a manual upload updates its release's status too; which release
            # is decided in "Resolve the version to build"
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "upload=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The "Resolve schema organization" step of register-schema.yml logs
          # which org it used. Anchoring at the end of the line skips the echo
          # commands themselves, which also appear in the log.
          log=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --log)
          if grep -qE 'Production: deploying to sage\.schemas\.ad$' <<<"$log"; then
            echo "Run $RUN_ID registered $TAG to sage.schemas.ad; building templates"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'Test: deploying to test\.ad$' <<<"$log"; then
            echo "::notice title=Not building::Run $RUN_ID registered $TAG to test.ad (pre-release). The Excel templates are built when the release is promoted to a full release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Couldn't tell which org run $RUN_ID registered to; has the Resolve schema organization message in register-schema.yml changed?"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.release.outputs.build == 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.release.outputs.build == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.release.outputs.build == 'true'
        # exact versions and hashes; Dependabot opens a PR monthly to update them
        run: pip install --require-hashes -r scripts/requirements-excel-templates.txt

      # Decide the version once (a blank manual version means the newest
      # registered one) and use it for the build and both release-page
      # updates, so the status always goes on the release that was built.
      - name: Resolve the version to build
        id: resolve
        if: steps.release.outputs.build == 'true'
        env:
          MODEL_VERSION: ${{ steps.release.outputs.version }}
          EVENT_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python -u scripts/create_excel_templates.py ${MODEL_VERSION:+--version "$MODEL_VERSION"} --resolve-only
          release=$(grep '^release=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "tag=${EVENT_TAG:-v$release}" >> "$GITHUB_OUTPUT"

      - name: Show the build started on the release page
        if: steps.release.outputs.upload == 'true' && steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          echo "::notice title=Excel templates are building::While this runs (about 5 minutes), do release Step 4: start the Core Models update, then approve and merge its pull request."
          python3 scripts/excel_templates_release_status.py --tag "$TAG" --state building --run-url "$RUN_URL"

      - name: Build and upload templates
        id: build
        if: steps.release.outputs.build == 'true'
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_TOKEN_DPE }}
          TEMPLATE_FOLDER_ID: ${{ vars.TEMPLATE_FOLDER_ID }}
          MODEL_VERSION: ${{ steps.resolve.outputs.release }}
          # manual runs only; workflow_run has no inputs, so automatic runs upload
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: python -u scripts/create_excel_templates.py --version "$MODEL_VERSION" $DRY_RUN

      - name: Show the result on the release page
        # automatic runs know their release even if resolving the version failed
        if: >-
          always() && steps.release.outputs.upload == 'true' &&
          (steps.resolve.outputs.tag != '' || steps.release.outputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag || steps.release.outputs.tag }}
          STATE: ${{ steps.build.outcome == 'success' && 'success' || 'failure' }}
          UPLOADED: ${{ steps.build.outputs.uploaded }}
          MODEL_VERSION: ${{ steps.build.outputs.release }}
          RELEASE_DATE: ${{ steps.build.outputs.registered_on }}
          FOLDER_ID: ${{ vars.TEMPLATE_FOLDER_ID }}
        run: |
          python3 scripts/excel_templates_release_status.py --tag "$TAG" --state "$STATE" \
            --run-url "$RUN_URL" --uploaded "$UPLOADED" --model-version "$MODEL_VERSION" \
            --release-date "$RELEASE_DATE" --folder-id "$FOLDER_ID"

      - name: Upload workbooks as artifacts
        if: always() && steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: excel-templates
          path: output/*.xlsx
          if-no-files-found: ignore
