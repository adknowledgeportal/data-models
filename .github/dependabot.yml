# Dependabot opens one pull request a month that updates the packages the
# Excel template build uses (scripts/requirements-excel-templates.txt).
# Nobody is notified automatically: checking for these PRs is the Monthly
# Maintenance in the README (assign yourself, approve and merge if its checks
# pass).
# See docs/excel-templates-maintenance.md.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    # only update the exact versions in the .txt, within the ranges in
    # requirements-excel-templates.in; a new major version (e.g. openpyxl 4)
    # needs someone to widen the range there on purpose
    versioning-strategy: lockfile-only
    groups:
      excel-template-packages:
        patterns:
          - "*"
    commit-message:
      prefix: "Excel templates"
